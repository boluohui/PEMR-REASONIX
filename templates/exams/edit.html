{% extends "base.html" %}
{% block title %}编辑检验检查结果 - 个人电子病历系统{% endblock %}

{% block content %}
<div class="md-card md-card-elevated">
    <div class="md-card-header">
        <i class="bi bi-pencil" style="color:var(--md-tertiary);"></i> 编辑检验检查结果
    </div>
    <div class="md-card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 md-field">
                    <label>检查日期 <span style="color:var(--md-error);">*</span></label>
                    <input type="date" class="md-input" name="exam_date" value="{{ exam.exam_date }}" required>
                </div>
                <div class="col-md-4 md-field">
                    <label>医院</label>
                    <input type="text" class="md-input" name="hospital" value="{{ exam.hospital or '' }}">
                </div>
                <div class="col-md-2 md-field">
                    <label>分类 <span style="color:var(--md-error);">*</span></label>
                    <select class="md-input" name="category" required>
                        <option value="检验" {{ 'selected' if exam.category == '检验' }}>检验</option>
                        <option value="检查" {{ 'selected' if exam.category == '检查' }}>检查</option>
                    </select>
                </div>
                <div class="col-md-2 md-field">
                    <label>关联记录ID</label>
                    <input type="number" class="md-input" name="medical_record_id" value="{{ exam.medical_record_id or '' }}">
                </div>
            </div>

            <div class="md-field">
                <label>项目名称 <span style="color:var(--md-error);">*</span></label>
                <input type="text" class="md-input" name="exam_name" value="{{ exam.exam_name }}" required>
            </div>

            <div class="row">
                <div class="col-md-4 md-field">
                    <label>结果</label>
                    <input type="text" class="md-input" name="result" value="{{ exam.result or '' }}">
                </div>
                <div class="col-md-4 md-field">
                    <label>参考范围</label>
                    <input type="text" class="md-input" name="reference_range" value="{{ exam.reference_range or '' }}">
                </div>
                <div class="col-md-4 md-field">
                    <label>单位</label>
                    <input type="text" class="md-input" name="unit" value="{{ exam.unit or '' }}">
                </div>
            </div>

            <div class="md-field">
                <label>结论/描述</label>
                <textarea class="md-input" name="conclusion" rows="3">{{ exam.conclusion or '' }}</textarea>
            </div>

            <div class="md-field">
                <label>备注</label>
                <textarea class="md-input" name="notes" rows="2">{{ exam.notes or '' }}</textarea>
            </div>

            <div class="md-flex-between">
                <a href="{{ url_for('exams.view_exam', exam_id=exam.id) }}" class="md-btn md-btn-outlined">
                    <i class="bi bi-x-lg"></i> 取消
                </a>
                <button type="submit" class="md-btn md-btn-filled">
                    <i class="bi bi-check-lg"></i> 更新结果
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
