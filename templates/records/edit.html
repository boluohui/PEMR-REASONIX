{% extends "base.html" %}
{% block title %}编辑就医记录 - 个人电子病历系统{% endblock %}

{% block content %}
<div class="md-card md-card-elevated">
    <div class="md-card-header">
        <i class="bi bi-pencil" style="color:var(--md-primary);"></i> 编辑就医记录
    </div>
    <div class="md-card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 md-field">
                    <label>就诊日期 <span style="color:var(--md-error);">*</span></label>
                    <input type="date" class="md-input" name="visit_date" value="{{ record.visit_date }}" required>
                </div>
                <div class="col-md-4 md-field">
                    <label>医院名称 <span style="color:var(--md-error);">*</span></label>
                    <input type="text" class="md-input" name="hospital" value="{{ record.hospital }}" required>
                </div>
                <div class="col-md-2 md-field">
                    <label>科室</label>
                    <input type="text" class="md-input" name="department" value="{{ record.department or '' }}">
                </div>
                <div class="col-md-2 md-field">
                    <label>医生</label>
                    <input type="text" class="md-input" name="doctor" value="{{ record.doctor or '' }}">
                </div>
            </div>

            <div class="md-field">
                <label>主诉</label>
                <textarea class="md-input" name="chief_complaint" rows="2">{{ record.chief_complaint or '' }}</textarea>
            </div>

            <div class="md-field">
                <label>现病史</label>
                <textarea class="md-input" name="present_illness" rows="3">{{ record.present_illness or '' }}</textarea>
            </div>

            <div class="md-field">
                <label>诊断</label>
                <textarea class="md-input" name="diagnosis" rows="2">{{ record.diagnosis or '' }}</textarea>
            </div>

            <div class="md-field">
                <label>备注</label>
                <textarea class="md-input" name="notes" rows="2">{{ record.notes or '' }}</textarea>
            </div>

            <div class="md-flex-between">
                <a href="{{ url_for('records.view_record', record_id=record.id) }}" class="md-btn md-btn-outlined">
                    <i class="bi bi-x-lg"></i> 取消
                </a>
                <button type="submit" class="md-btn md-btn-filled">
                    <i class="bi bi-check-lg"></i> 更新记录
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
